services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pcascade
      POSTGRES_PASSWORD: pcascade
      POSTGRES_DB: pcascade_test
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcascade -d pcascade_test"]
      interval: 2s
      timeout: 3s
      retries: 30
